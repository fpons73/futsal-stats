[package]
name = "futsal-stats"
version = "1.0.0"
description = "Estadísticas y gestión de actas de fútbol sala (Tauri + React + SQLite)"
license = "MIT"
authors = ["FcoP11"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "futsal_stats_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
reqwest = { version = "0.12", features = ["blocking"] }
# Acceso directo a sqlx para transacciones reales (mismas features que tauri-plugin-sql)
# + "migrate" para las migraciones en tests de integración y "macros" para query_as
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
# Runtime para el gancho async de backup diario en el arranque
# (mismo crate que reexporta tauri; features mínimas)
tokio = { version = "1", features = ["time"] }
# Misma familia de versiones que usa tauri::fs::Scope internamente (tests)
glob = "0.3"
# Nombres de fichero de copia de seguridad con fecha (already in tree via sqlx)
time = "0.3"

[dev-dependencies]
# mock_app para probar el alcance fs real (tauri::fs::Scope) en tests de integración
tauri = { version = "2", features = ["test"] }
# Runtime async para el test de migraciones (SqlitePool::connect + timeout en
# el cierre de emergencia del pool desde la guardia de limpieza)
tokio = { version = "1", features = ["rt", "macros", "time"] }


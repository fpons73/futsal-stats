name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Etiqueta del release (vacío = versión de tauri.conf.json)"
        required: false
        default: ""

# Necesario para crear el borrador de Release con los instaladores adjuntos
permissions:
  contents: write

jobs:
  build:
    name: Instalador Windows (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias del frontend
        run: npm ci

      # En push de tag usa la etiqueta tal cual; en dispatch manual la entrada
      # tag_name o, si está vacía, la versión de tauri.conf.json.
      # Las versiones con sufijo (1.0.0-rc.1, 2.0.0-beta) se marcan prerelease.
      - name: Determinar etiqueta del release
        id: tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            *-*) echo "es_prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "es_prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # beforeBuildCommand (npm run build: tsc + vite) corre dentro de la acción.
      # Solo NSIS: es el entregable para usuarios (decisión del hito; el MSI además
      # no soporta versiones prerelease como 1.0.0-rc.1). Publica un DRAFT con el
      # instalador: revisar, editar notas y publicar desde la UI de GitHub
      # (proceso completo en CONTRIBUTING.md).
      - name: Compilar instalador y crear borrador de Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles nsis
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: "Global Futsal Stats ${{ steps.tag.outputs.tag }}"
          releaseBody: >
            Instalador de Windows (NSIS).


            **Instalación**: descarga `Global Futsal Stats_*_x64-setup.exe`, ejecútalo
            y sigue el asistente. No requiere Node ni Rust (solo WebView2, incluido
            en Windows 10/11 actualizados).


            **Aviso de SmartScreen**: el binario aún no está firmado digitalmente, por
            lo que Windows puede mostrar "aplicación no reconocida" — pulsa
            *Más información* → *Ejecutar de todas formas*.
          releaseDraft: true
          prerelease: ${{ steps.tag.outputs.es_prerelease }}

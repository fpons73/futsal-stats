name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Etiqueta del release (vacío = versión de tauri.conf.json)"
        required: false
        default: ""

# Necesario para crear el borrador de Release con los instaladores adjuntos
permissions:
  contents: write

jobs:
  build:
    name: Instalador Windows (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias del frontend
        run: npm ci

      # En push de tag usa la etiqueta tal cual; en dispatch manual la entrada
      # tag_name o, si está vacía, la versión de tauri.conf.json.
      # Las versiones con sufijo (1.0.0-rc.1, 2.0.0-beta) se marcan prerelease.
      - name: Determinar etiqueta del release
        id: tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            *-*) echo "es_prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "es_prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # beforeBuildCommand (npm run build: tsc + vite) corre dentro de la acción.
      # Solo NSIS: es el entregable para usuarios (decisión del hito; el MSI además
      # no soporta versiones prerelease como 1.0.0-rc.1). Publica un DRAFT con el
      # instalador: revisar, editar notas y publicar desde la UI de GitHub
      # (proceso completo en CONTRIBUTING.md).
      - name: Compilar instalador y crear borrador de Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles nsis
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: "Global Futsal Stats ${{ steps.tag.outputs.tag }}"
          # Plantilla de notas orientada a USUARIO FINAL (no desarrollador):
          # sin jerga (nada de Node/NSIS/Rust), qué es la app, instalación con
          # el aviso de SmartScreen explicado, primer uso, privacidad y
          # petición de feedback. El texto fino por versión se edita en el
          # borrador antes de publicar (runbook de cierre).
          releaseBody: >
            **Global Futsal Stats** es una aplicación de escritorio para Windows
            que sirve para gestionar y analizar estadísticas de fútbol sala:
            competiciones, equipos, jugadores, entrenadores, árbitros y partidos
            con acta completa, pizarra táctica y actas en PDF.


            ## Instalación


            1. Descarga el instalador (botón *Assets* más abajo, ~11 MB).

            2. Ejecútalo y sigue el asistente. **Requisito**: Windows 10 u 11 de
            64 bits. Si a tu Windows le falta el componente gráfico WebView2, el
            propio instalador lo descarga.

            3. Si Windows muestra «Windows protegió tu equipo», pulsa **Más
            información → Ejecutar de todas formas**: la app aún no está firmada
            digitalmente. Es el aviso normal para apps sin certificado de pago,
            no significa que sea peligrosa.


            ## Primer uso


            Al abrir por primera vez, un **asistente de bienvenida** te propondrá
            elegir una carpeta de datos e importar automáticamente los ficheros
            CSV de la enciclopedia de futsal que tengas (también los detecta
            dentro de subcarpetas como `Futsal_Data/`). Puedes saltarlo y empezar
            de cero si prefieres crear tus datos a mano.


            **Tus datos se quedan en tu PC** (nada se envía a ningún servidor) y
            la app crea **copias de seguridad automáticas diarias** que puedes
            restaurar desde Configuración.


            ## ¿Problemas o sugerencias?


            [Abre un issue](https://github.com/fpons73/futsal-stats/issues) con
            los pasos que seguiste y, si puedes, una captura — nos ayudas a
            mejorar la aplicación.
          releaseDraft: true
          prerelease: ${{ steps.tag.outputs.es_prerelease }}

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Etiqueta del release (vacío = versión de tauri.conf.json)"
        required: false
        default: ""

# Necesario para crear el borrador de Release con los instaladores adjuntos
permissions:
  contents: write

jobs:
  build:
    name: Instalador Windows (NSIS)
    runs-on: windows-latest
    # Firma de código (A1): los secrets de Certum (tarjeta cloud SimplySign)
    # se exponen a nivel de job para poder usarlos en los `if` de los pasos.
    # Si no están configurados, la release se genera SIN FIRMAR (como hasta
    # ahora): la firma es un paso condicionado, nunca bloquea una release.
    env:
      CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
      CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
      CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias del frontend
        run: npm ci

      # --- Firma de código (A1 del roadmap) ----------------------------------
      # Conecta la tarjeta cloud de Certum (SimplySign) montando el certificado
      # en el almacén del runner. Solo se ejecuta si los tres secrets existen;
      # el propio binario se firma dentro del build vía bundle.windows.signCommand
      # (scripts/firmar/signar.ps1), que el bundler de Tauri llama por cada
      # artefacto (ejecutable, desinstalador, instalador NSIS).
      - name: Conectar tarjeta cloud de Certum (solo si hay secrets)
        if: ${{ env.CERTUM_OTP_URI != '' && env.CERTUM_USERNAME != '' && env.CERTUM_KEY_ID != '' }}
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/firmar/conectar-simplysign.ps1

      # --- Auto-actualizador (A2) --------------------------------------------
      # El updater exige firmar los artefactos (minisign). Si el secret
      # TAURI_SIGNING_PRIVATE_KEY existe, se inyecta (soporta multi-línea con
      # heredoc) y el build genera los artefactos de actualización + latest.json.
      # Si no existe, el build sigue siendo posible: se desactiva
      # createUpdaterArtifacts vía --config para que el CLI no exija la clave.
      - name: Preparar clave de firma del updater (si existe el secret)
        shell: bash
        env:
          K: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          P: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$K" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY<<CLAVE_EOF" >> "$GITHUB_ENV"
            echo "$K" >> "$GITHUB_ENV"
            echo "CLAVE_EOF" >> "$GITHUB_ENV"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$P" >> "$GITHUB_ENV"
            echo "args_extra=" >> "$GITHUB_ENV"
            echo "firma_updater=activada"
          else
            echo "args_extra=--config {\"bundle\":{\"createUpdaterArtifacts\":false}}" >> "$GITHUB_ENV"
            echo "firma_updater=sin-clave (release sin artefactos de updater)"
          fi

      # En push de tag usa la etiqueta tal cual; en dispatch manual la entrada
      # tag_name o, si está vacía, la versión de tauri.conf.json.
      # Las versiones con sufijo (1.0.0-rc.1, 2.0.0-beta) se marcan prerelease.
      - name: Determinar etiqueta del release
        id: tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            *-*) echo "es_prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "es_prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # beforeBuildCommand (npm run build: tsc + vite) corre dentro de la acción.
      # Solo NSIS: es el entregable para usuarios (decisión del hito; el MSI además
      # no soporta versiones prerelease como 1.0.0-rc.1). Publica un DRAFT con el
      # instalador: revisar, editar notas y publicar desde la UI de GitHub
      # (proceso completo en CONTRIBUTING.md).
      - name: Compilar instalador y crear borrador de Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # args_extra queda vacío cuando hay clave de updater; sin clave añade
          # el --config que desactiva los artefactos de actualización (ver arriba).
          args: --bundles nsis ${{ env.args_extra }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: "Global Futsal Stats ${{ steps.tag.outputs.tag }}"
          # Plantilla de notas orientada a USUARIO FINAL (no desarrollador):
          # sin jerga (nada de Node/NSIS/Rust), qué es la app, instalación con
          # el aviso de SmartScreen explicado, primer uso, privacidad y
          # petición de feedback. El texto fino por versión se edita en el
          # borrador antes de publicar (runbook de cierre).
          releaseBody: >
            **Global Futsal Stats** es una aplicación de escritorio para Windows
            que sirve para gestionar y analizar estadísticas de fútbol sala:
            competiciones, equipos, jugadores, entrenadores, árbitros y partidos
            con acta completa, pizarra táctica y actas en PDF.


            ## Instalación


            1. Descarga el instalador (botón *Assets* más abajo, ~11 MB).

            2. Ejecútalo y sigue el asistente. **Requisito**: Windows 10 u 11 de
            64 bits. Si a tu Windows le falta el componente gráfico WebView2, el
            propio instalador lo descarga.

            3. Si Windows muestra «Windows protegió tu equipo», pulsa **Más
            información → Ejecutar de todas formas**. En versiones recientes de
            Windows la aplicación ya va firmada digitalmente y el aviso no
            debería aparecer; si te aparece, avísanos abriendo un issue.


            ## Primer uso


            Al abrir por primera vez, un **asistente de bienvenida** te propondrá
            elegir una carpeta de datos e importar automáticamente los ficheros
            CSV de la enciclopedia de futsal que tengas (también los detecta
            dentro de subcarpetas como `Futsal_Data/`). Puedes saltarlo y empezar
            de cero si prefieres crear tus datos a mano.


            **Tus datos se quedan en tu PC** (nada se envía a ningún servidor) y
            la app crea **copias de seguridad automáticas diarias** que puedes
            restaurar desde Configuración.


            ## ¿Problemas o sugerencias?


            [Abre un issue](https://github.com/fpons73/futsal-stats/issues) con
            los pasos que seguiste y, si puedes, una captura — nos ayudas a
            mejorar la aplicación.
          releaseDraft: true
          prerelease: ${{ steps.tag.outputs.es_prerelease }}
